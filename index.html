<!doctype html>
<html lang="ja">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#fafafa"><title>Shift Maker — シフト入力</title><link rel="stylesheet" href="./style.css?v=2"></head>
<body>
<header><a href="./" class="brand">Shift Maker</a><span class="local-badge">自動保存</span></header>
<main>
<div class="period-nav"><button id="prev" aria-label="前の期間">‹</button><label>開始月<input id="month-picker" type="month" aria-label="期間の開始月"></label><button id="next" aria-label="次の期間">›</button><button id="today" class="secondary">現在の期間</button></div>
<div class="layout">
<div class="calendar-pane"><section class="calendar" aria-label="シフトカレンダー">
<div class="calendar-top"><div><h1 id="month">シフト入力</h1><p id="year" class="period-range"></p></div><div class="selection-count"><strong id="selection">0日選択中</strong><button id="deselect" class="text-button">解除</button></div></div>
<div class="weekdays" aria-hidden="true"><span>日</span><span>月</span><span>火</span><span>水</span><span>木</span><span>金</span><span>土</span></div><div id="days" class="days"></div>
</section><div class="calendar-footer"><span id="summary"></span><button id="select-all" class="text-button">期間をすべて選択</button></div><p class="calendar-help">日付を選択して、下のプリセットや時間指定で入力できます。</p>
<details class="storage"><summary>バックアップ</summary><p>入力はこのブラウザに自動保存されます。端末の変更やデータ削除に備えて書き出せます。</p><div><button id="export" class="secondary">書き出す</button><button id="import" class="secondary">読み込む</button><input type="file" id="file" accept="application/json,.json" hidden></div></details></div>
<aside id="control-pane"><button id="sheet-toggle" aria-expanded="true" aria-controls="control-content"><span class="handle-bar"></span><span class="sheet-label">入力パネルを閉じる</span></button><div id="control-content" class="editor"><div class="section-top"><h2>プリセット</h2><p id="selection-help">日付を複数選べます</p></div><div class="presets"><button data-preset="off"><strong class="off-text">休み</strong></button><button data-preset="early"><strong>早番</strong><small>09:30–19:00</small></button><button data-preset="free"><strong>Free</strong></button><button data-preset="late"><strong>遅番</strong><small>11:00–20:45</small></button></div>
<details class="custom-section"><summary>時間指定</summary><form id="custom"><div class="time-inputs"><label>開始<input id="start" type="time" value="09:30" required></label><span>〜</span><label>終了<input id="end" type="time" value="19:00" required></label></div><p class="small muted">終了が開始より前なら翌日扱いです。</p><button class="primary" type="submit">選択した日付に適用</button></form></details>
<button id="clear" class="text-button clear">選択した日の入力を消す</button><p id="status" role="status" aria-live="polite">日付を選択してください</p></div></aside>
</div></main><script type="module" src="./app.js?v=2"></script>
</body></html>
